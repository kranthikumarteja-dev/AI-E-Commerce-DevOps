name: Product Service CI

on:
  push:
    branches:
      - main
    paths:
      - "services/product-service/**"
      - ".github/workflows/product-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "services/product-service/**"
      - ".github/workflows/product-service-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-test-scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        working-directory: services/product-service
        run: |
          mvn clean verify

      - name: Build Docker image
        run: |
          docker build \
            -t ai-ecommerce/product-service:${{ github.sha }} \
            services/product-service

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ai-ecommerce/product-service:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag ai-ecommerce/product-service:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/product-service:${{ github.sha }}

          docker tag ai-ecommerce/product-service:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/product-service:latest

          docker push ghcr.io/${{ github.repository_owner }}/product-service:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/product-service:latest
